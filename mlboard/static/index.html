'use strict';
const $=s=>document.querySelector(s), el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const local=MLBoardLocal,preferences=window.mlboardLocalPreferences,preferenceStorage=window.mlboardLocalStorage;
const bindings=new Set(),responseBytes=new WeakMap();

const names=new Map(), cache=new Map(), plotViews=new Map();
function bind(node,key,params={},attribute=null){
  const entry={node,key,params,attribute};bindings.add(entry);updateBinding(entry);return node;
}
function updateBinding(entry){
  const text=typeof entry.key==='function'?entry.key():t(entry.key,typeof entry.params==='function'?entry.params():entry.params);
  if(entry.attribute)entry.node.setAttribute(entry.attribute,text);else entry.node.textContent=text;

function ui(tag,key,params={},cls){return bind(el(tag,undefined,cls),key,params)}
function updateBindings(){for(const entry of bindings){if(!entry.node.isConnected)bindings.delete(entry);else updateBinding(entry)}}
function pruneBindings(){for(const entry of bindings)if(!entry.node.isConnected)bindings.delete(entry)}
function codedError(code,message=code){return Object.assign(Error(message),{code})}
function error(e){activeError=e;$('#error').textContent=local.errorText(language(),e);$('#error').style.display='block'}
function clearError(){activeError=null;$('#error').style.display='none'}
async function api(path,options={}){
  const res=await fetch('/api/v1'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});
  const raw=await res.text(),body=JSON.parse(raw);responseBytes.set(body,new TextEncoder().encode(raw).length);

}
function formatNumber(value,options={}){return local.number(language(),value,options)}
function readable(n){return n<1024?formatNumber(n)+' B':n<1048576?formatNumber(n/1024,{maximumFractionDigits:1})+' KiB':formatNumber(n/1048576,{maximumFractionDigits:1})+' MiB'}
function timeLabel(value){return new Intl.DateTimeFormat(language(),{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(value))}
function tickLabel(value,digits=4){const absolute=Math.abs(value);return formatNumber(value,{maximumSignificantDigits:digits,useGrouping:false,notation:absolute>=100000||(absolute>0&&absolute<.001)?'scientific':'standard'})}
function chartStatus(){if(lastChartStatus)$('#notice').textContent=t('chart.updated',{count:lastChartStatus.points,time:timeLabel(lastChartStatus.time)})}
function selectedLabel(){$('#experimentsToggle').textContent=t('experiments.selected',{count:selected.size})}
function runName(id){return names.get(id)||id.slice(0,8)}
function stableColor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return 'var(--series-'+h%10+')'}
function cancel(){generation++;chartQueue.cancel();plotViews.clear();if(controller)controller.abort();controller=new AbortController()}
async function boot(){
  try{
    const hash=new URLSearchParams(location.hash.slice(1)),token=hash.get('token');
    if(token){
      history.replaceState(null,'',location.pathname);
      const r=await fetch('/api/local/session',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});
      if(!r.ok)throw codedError('SESSION_FAILED');
    }
    const p=await api('/projects');
    for(const item of p.projects){const option=el('option',item.name);option.value=item.id;$('#project').append(option)}
    if(!p.projects.length){$('#content').append(ui('div','empty.experiments',{},'empty'));return}
    project=p.projects[0].id;await loadRuns();await render();
  }catch(e){error(e)}
}
async function loadRuns(append=false){const q=new URLSearchParams({search:$('#search').value,limit:'100'});if(append&&nextRun)q.set('cursor',nextRun);const data=await api('/projects/'+project+'/runs?'+q);runs=append?[...runs,...data.runs]:data.runs;nextRun=data.next_cursor;for(const r of runs)names.set(r.id,r.run_path);if(!append){selected=new Set(runs.slice(0,Math.min(3,runs.length)).map(r=>r.id))}drawRuns()}
function drawRuns(){
  const box=$('#runs');box.replaceChildren();let last=null;
  for(const run of runs){
    const prefix=run.run_path.includes('/')?run.run_path.slice(0,run.run_path.lastIndexOf('/')):'';
    if(prefix!==last){box.append(prefix?el('small',prefix):ui('small','experiments.ungrouped'));last=prefix}
    const label=el('label',undefined,'run'),check=el('input');check.type='checkbox';check.checked=selected.has(run.id);
    check.onchange=()=>{
      if(check.checked&&selected.size>=10){check.checked=false;error(codedError('RUN_LIMIT'));return}
      check.checked?selected.add(run.id):selected.delete(run.id);render();
    };
    const body=el('span',run.name||run.run_path);
    const state=local.messages.en['state.'+run.state]?ui('small','state.'+run.state,{},'state'):el('small',run.state,'state');
    body.append(el('small',run.run_path),state);label.append(check,body);box.append(label);
  }

function drawNav(){
  const nav=$('#nav');nav.replaceChildren();
  for(const id of ['workspace','config','records','files','logs','query','storage']){
    const button=ui('button','nav.'+id,{},id===view?'active':'');button.onclick=()=>{view=id;render()};nav.append(button);
  }
}
async function render(){
  cancel();clearError();drawNav();selectedLabel();
  const gen=generation,content=$('#content');content.replaceChildren();content.append(ui('h2','view.'+view));
  if(!selected.size&&view!=='storage'){content.append(ui('div','empty.selection',{},'empty'));pruneBindings();return}
  try{
    if(view==='workspace')await workspace(gen);else if(view==='query')queryEditor();else if(view==='storage')await storage();else await detail(gen);
  }catch(e){if(e.name!=='AbortError')error(e)}
  pruneBindings();
}
function querySpec(metrics,axis='step'){return {schema_version:'mlboard.query/v1',runs:{run_ids:[...selected]},source:{kind:'scalar',metrics:metrics.map(m=>({name:m.name,context:m.context||{}}))},x:{field:axis},read:{producers:{mode:'primary'},sessions:{mode:'all'},duplicate_steps:'latest_logical'},transform:{kind:'downsample',algorithm:'min_max',points_per_series:600},page:{limit:20000},budget:{max_runs:10,max_series:20,max_points:20000,max_scanned_points:250000,max_bytes:2097152}}}
async function workspace(gen){
  const content=$('#content'),tools=el('div',undefined,'tools'),smoothing=el('input');
  smoothing.type='range';smoothing.min=0;smoothing.max=.95;smoothing.step=.05;smoothing.value=smooth;
  bind(smoothing,'chart.smoothing',{},'aria-label');
  const smoothLabel=el('label');smoothLabel.append(ui('span','chart.smoothing'),smoothing);
  smoothing.oninput=()=>{smooth=Number(smoothing.value);preferenceStorage.setItem('mlboard-smooth',smooth);drawVisible(gen)};
  const refresh=ui('button','action.refresh');refresh.onclick=()=>drawVisible(gen,true);tools.append(smoothLabel,refresh);content.append(tools);
  const unique=new Map();
  for(const rid of selected){
    let cursor=null,total=0;
    do{
      const suffix=cursor?'?limit=1000&cursor='+encodeURIComponent(cursor):'?limit=1000';
      const response=await api('/runs/'+rid+'/series'+suffix,{signal:controller.signal});
      for(const metric of response.series)if(metric.kind==='scalar')unique.set(metricKey(metric),metric);
      cursor=response.next_cursor;total+=response.series.length;
      if(total>=1000&&cursor)throw codedError('METRIC_LIMIT');
    }while(cursor);
  }
  if(gen!==generation)return;
  series=[...unique.values()].sort((a,b)=>a.name.localeCompare(b.name));groups=new Map();
  for(const metric of series){const key=metric.name.includes('/')?metric.name.slice(0,metric.name.lastIndexOf('/')):'';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(metric)}
  let index=0;
  for(const [key,metrics] of groups){
    const group=el('details',undefined,'group');group.dataset.group=key;
    const saved=preferenceStorage.getItem('mlboard-group-'+key);group.open=saved===null?index++===0:saved==='true';
    const title=el('summary');title.append(key?document.createTextNode(key):ui('span','chart.metrics'),ui('small','chart.metricCount',{count:metrics.length}));
    group.append(title,el('div',undefined,'cards'));let previousOpen=group.open;
    group.ontoggle=()=>{
      if(group.open===previousOpen)return;previousOpen=group.open;preferenceStorage.setItem('mlboard-group-'+key,String(group.open));
      if(!group.open)group.querySelector('.cards').replaceChildren();drawVisible(gen);
    };
    content.append(group);
  }
  if(!series.length)content.append(ui('div','empty.scalars',{},'empty'));
  await drawVisible(gen);
}
class LatestQueryQueue {
  constructor(execute,onError=()=>{}){
    this.execute=execute;this.onError=onError;
    this.active=null;this.pending=null;this.latestKey=null;this.timer=null;
  }
  cancel(){
    this.latestKey=null;
    if(this.pending)this.pending.resolve(false);
    this.pending=null;
    clearTimeout(this.timer);this.timer=null;
    // Let an HTTP request settle: aborting fetch cannot cancel server work.
  }
  submit(job){
    this.latestKey=job.key;
    if(this.active?.key===job.key){
      if(this.pending)this.pending.resolve(false);
      this.pending=null;return this.active.promise;
    }
    if(this.pending?.key===job.key){
      this.pending.force=this.pending.force||job.force;return this.pending.promise;
    }
    if(this.pending)this.pending.resolve(false);
    job.promise=new Promise(resolve=>job.resolve=resolve);
    this.pending=job;this.schedule();return job.promise;
  }
  schedule(){
    if(!this.active&&!this.timer&&this.pending)this.timer=setTimeout(()=>this.pump(),25);
  }
  async pump(){
    this.timer=null;
    if(this.active||!this.pending)return;
    const job=this.pending;this.pending=null;this.active=job;
    const current=()=>this.latestKey===job.key;
    try{await this.execute(job,current)}
    catch(e){if(current())this.onError(e,job)}
    finally{this.active=null;job.resolve(current());this.schedule()}
  }
}
async function loadChartResponse(job,current){
  const deadline=job.deadline??Date.now()+5000;
  for(let attempt=0;attempt<8;attempt++){
    if(!current())throw new DOMException('Query superseded','AbortError');
    const remaining=deadline-Date.now();
    if(remaining<=0)throw Object.assign(Error('Query timed out. Refresh to retry.'),{code:'CLIENT_QUERY_TIMEOUT'});
    const requestController=new AbortController();
    const timeout=setTimeout(()=>requestController.abort(),remaining);
    try{
      return await api('/projects/'+job.project+'/query',{method:'POST',body:JSON.stringify(job.spec),signal:requestController.signal});
    }catch(e){
      if(e.name==='AbortError')throw Object.assign(Error('Query timed out. Refresh to retry.'),{code:'CLIENT_QUERY_TIMEOUT'});
      if(e.status!==429||e.code!=='QUERY_BUSY'||attempt===7)throw e;
    }finally{clearTimeout(timeout)}
    await new Promise(resolve=>setTimeout(resolve,Math.min(800,150*2**attempt,Math.max(0,deadline-Date.now()))));
  }
}
function metricKey(metric){return JSON.stringify([metric.name,Object.fromEntries(Object.keys(metric.context||{}).sort().map(key=>[key,metric.context[key]]))])}
async function loadChartCohort(job,current){
  const deadline=Date.now()+5000;
  const remaining={max_series:20,max_points:20000,max_scanned_points:250000,max_bytes:2097152};
  const results=[];
  for(const group of job.axisGroups){
    if(!current())throw new DOMException('Query superseded','AbortError');
    const timeout=deadline-Date.now();
    if(timeout<=0)throw codedError('CLIENT_QUERY_TIMEOUT');
    if(Object.values(remaining).some(value=>value<=0))throw codedError('CLIENT_BUDGET_EXCEEDED');
    const spec={...group.spec,page:{...group.spec.page,limit:remaining.max_points},budget:{...group.spec.budget,...remaining,timeout_ms:Math.min(2000,timeout)}};
    const response=await loadChartResponse({project:job.project,spec,deadline},current);
    if(!current())throw new DOMException('Query superseded','AbortError');
    if(Date.now()>=deadline)throw codedError('CLIENT_QUERY_TIMEOUT');
    const used={max_series:response.frames.length,max_points:response.page.returned_rows,max_scanned_points:response.diagnostics.scanned_points,max_bytes:responseBytes.get(response)??new TextEncoder().encode(JSON.stringify(response)).length};
    if(response.complete!==true||response.page.next_cursor||response.diagnostics.truncated_by?.length)throw codedError('CLIENT_BUDGET_EXCEEDED');
    for(const key of Object.keys(remaining)){
      if(!Number.isSafeInteger(used[key])||used[key]<0||used[key]>remaining[key])throw codedError('CLIENT_BUDGET_EXCEEDED');
      remaining[key]-=used[key];
    }
    results.push({...group,response});
  }
  return {groups:results,points:20000-remaining.max_points};
}
function chartCard(metric){return [...document.querySelectorAll('.card[data-metric]')].find(n=>n.dataset.metric===metricKey(metric))}
function prepareChartCards(open,chosen){
  for(const group of open){
    const cards=group.querySelector('.cards');
    for(const metric of groups.get(group.dataset.group)||[]){
      let card=[...cards.children].find(n=>n.dataset.metric===metricKey(metric));
      if(!card){
        card=el('div',undefined,'card');card.dataset.metric=metricKey(metric);card.append(el('h3',metric.name));
        if(Object.keys(metric.context||{}).length)card.append(el('pre',JSON.stringify(metric.context)));
        const label=el('label',undefined,'chart-controls'),axisSelect=el('select');
        label.append(ui('span','chart.axis'),axisSelect);bind(axisSelect,'chart.axis',{},'aria-label');
        for(const axis of local.AXES){const option=ui('option','axis.'+axis);option.value=axis;axisSelect.append(option)}
        const cardProject=project,cardGeneration=generation;
        axisSelect.onchange=()=>{
          if(cardGeneration!==generation||cardProject!==project)return;
          local.writeAxis(preferenceStorage,cardProject,metric,axisSelect.value);drawVisible(cardGeneration);
        };
        card.append(label,el('div',undefined,'chart-content'));cards.append(card);
      }
      const axis=local.readAxis(preferenceStorage,project,metric),target=card.querySelector('.chart-content');
      card.querySelector('select').value=axis;
      if(!chosen.includes(metric)){target.dataset.axis='';target.replaceChildren(ui('p','chart.limit',{},'muted'))}
      else if(target.dataset.axis!==axis){target.dataset.axis=axis;target.replaceChildren(ui('p','chart.loading',{},'muted'))}
    }
  }
}
const chartQueue=new LatestQueryQueue(async(job,current)=>{
  let cohort;
  if(!job.force&&cache.has(job.cacheKey))cohort=cache.get(job.cacheKey);
  else{
    cohort=await loadChartCohort(job,current);
    cache.set(job.cacheKey,cohort);
    while(cache.size>8)cache.delete(cache.keys().next().value);
  }
  if(!current()||job.generation!==generation||view!=='workspace')return;
  clearError();
  for(const group of cohort.groups)for(const metric of group.metrics){
    const frames=group.response.frames.filter(frame=>metricKey({name:frame.meta.metric,context:frame.meta.context})===metricKey(metric));
    const card=chartCard(metric),target=card?.querySelector('.chart-content');if(!target)continue;
    target.replaceChildren();target.dataset.axis=group.axis;plot(target,frames,group.axis);
  }
  prunePlots();pruneBindings();lastChartStatus={points:cohort.points,time:Date.now()};chartStatus();
},(e,job)=>{
  if(e.name==='AbortError'||job.generation!==generation||view!=='workspace')return;
  error(e);
  for(const metric of job.chosen){
    const card=chartCard(metric),target=card?.querySelector('.chart-content');
    if(target&&!target.querySelector('.plot'))target.replaceChildren(bind(el('p',undefined,'muted'),()=>local.errorText(language(),e)));
  }
  pruneBindings();
});
function drawVisible(gen,force=false){
  if(gen!==generation||view!=='workspace')return Promise.resolve(false);
  const open=[...document.querySelectorAll('details.group[open]')];
  const metrics=open.flatMap(g=>groups.get(g.dataset.group)||[]);
  if(!metrics.length){chartQueue.cancel();return Promise.resolve(false)}
  const maximum=Math.max(1,Math.floor(20/selected.size)),chosen=metrics.slice(0,maximum);
  prepareChartCards(open,chosen);prunePlots();
  const byAxis=new Map();
  for(const metric of chosen){const axis=local.readAxis(preferenceStorage,project,metric);if(!byAxis.has(axis))byAxis.set(axis,[]);byAxis.get(axis).push(metric)}
  const axisGroups=[...byAxis].map(([axis,metrics])=>({axis,metrics,spec:querySpec(metrics,axis)})),cacheKey=JSON.stringify(axisGroups.map(group=>group.spec));
  return chartQueue.submit({key:gen+':'+project+':'+cacheKey,cacheKey,axisGroups,project,generation:gen,chosen,force});
}
function svgEl(tag,attrs={}){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));return n}
function prunePlots(){for(const node of plotViews.keys())if(!node.isConnected)plotViews.delete(node)}
function plot(parent,frames,axis,smoothing=smooth){
  const target=el('div');parent.append(target);
  paintPlot(target,frames,axis,smoothing);
  plotViews.set(target,{frames,axis,smoothing,width:target.clientWidth});
}
function paintPlot(parent,frames,axis,smoothing){
  parent.replaceChildren();
  const style=getComputedStyle(parent);
  const width=parent.clientWidth-parseFloat(style.paddingLeft||0)-parseFloat(style.paddingRight||0);
  const W=Math.max(240,Math.floor(width||610)),H=260,L=58,R=14,T=14,B=36;
  const integerAxis=['step','processed_samples'].includes(axis)&&frames.every(f=>f.columns.x.every(x=>typeof x==='string'&&/^[0-9]+$/.test(x)));
  let origin=null;
  if(integerAxis)for(const f of frames)for(const x of f.columns.x){const exact=BigInt(x);if(origin===null||exact<origin)origin=exact}
  const position=x=>axis==='wall_time'?Date.parse(x):integerAxis?Number(BigInt(x)-origin):Number(x);
  const labelX=x=>axis==='wall_time'?timeLabel(x):integerAxis?formatNumber(origin+BigInt(Math.round(x)),{useGrouping:false}):tickLabel(x);
  const frameLabel=frame=>frame.meta.labelKey?t(frame.meta.labelKey):(frame.meta.label||runName(frame.meta.run_id));
  let all=[];
  const prepared=frames.map(f=>{
    let avg=null;
    const points=f.columns.x.map((x,i)=>{
      let y=f.columns.value[i];
      if(f.columns.value_state[i]!=='finite'||y===null){avg=null;y=null}
      else{avg=avg===null?y:smoothing*avg+(1-smoothing)*y;y=avg}
      return [position(x),y,i];
    });
    all.push(...points.filter(p=>p[1]!==null));return {f,points};
  });
  if(!all.length){parent.append(ui('div','empty.finite',{},'empty'));return}
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(xmin===xmax)xmax=xmin+1;
  if(ymin===ymax){ymin-=.5;ymax+=.5}
  const pad=(ymax-ymin)*.07;ymin-=pad;ymax+=pad;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'plot',role:'img'});bind(svg,'chart.description',{},'aria-label');
  for(let i=0;i<=4;i++){
    const y=T+i*(H-T-B)/4;
    svg.append(svgEl('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'var(--chart-grid)'}));
    const label=svgEl('text',{x:L-8,y:y+4,'text-anchor':'end',fill:'var(--chart-axis)','font-size':11});
    label.textContent=tickLabel(ymax-i*(ymax-ymin)/4,3);svg.append(label);
  }
  for(let i=0;i<=4;i++){
    const value=xmin+i*(xmax-xmin)/4,label=svgEl('text',{x:X(value),y:H-12,'text-anchor':'middle',fill:'var(--chart-axis)','font-size':11});
    label.textContent=labelX(value);svg.append(label);
  }
  for(const {f,points} of prepared){
    let path='',move=true;
    for(const [x,y] of points){if(y===null){move=true;continue}path+=(move?'M':'L')+X(x).toFixed(2)+','+Y(y).toFixed(2);move=false}
    const color=stableColor(f.meta.run_id),line=svgEl('path',{d:path,fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round'});
    svg.append(line);
    if(points.filter(p=>p[1]!==null).length===1){const p=points.find(p=>p[1]!==null);svg.append(svgEl('circle',{cx:X(p[0]),cy:Y(p[1]),r:3,fill:color}))}
    const title=svgEl('title');title.textContent=frameLabel(f)+' · '+f.meta.metric;line.append(title);
  }
  parent.append(svg);
  const legend=el('div',undefined,'legend');
  for(const {f} of prepared){const item=el('span'),dot=el('i',undefined,'swatch');dot.style.background=stableColor(f.meta.run_id);item.append(dot,document.createTextNode(frameLabel(f)));legend.append(item)}
  parent.append(legend);
}
function summaryTable(summary){
  const wrapper=el('div',undefined,'native'),table=el('table'),head=el('tr');
  for(const name of ['metric','context','last','min','max','count'])head.append(ui('th','summary.'+name));
  table.append(head);
  const values=Object.values(summary).sort((a,b)=>a.name.localeCompare(b.name)||JSON.stringify(a.context).localeCompare(JSON.stringify(b.context)));
  for(const metric of values){
    const row=el('tr');
    for(const value of [metric.name,JSON.stringify(metric.context),metric.value_state==='finite'?metric.last:metric.value_state,metric.min,metric.max,metric.count])row.append(el('td',String(value??'—')));
    table.append(row);
  }
  wrapper.append(table);return wrapper;
}
function jsonBlock(value){return el('pre',JSON.stringify(value,null,2))}
async function detail(gen){
  const content=$('#content');
  for(const rid of selected){
    const section=el('section',undefined,'card');section.style.marginTop='16px';section.append(el('h3',runName(rid)));content.append(section);
    if(view==='config'){
      const run=await api('/runs/'+rid,{signal:controller.signal});if(gen!==generation)return;
      const sessions=await api('/runs/'+rid+'/sessions',{signal:controller.signal});if(gen!==generation)return;
      section.append(ui('small','detail.config'),jsonBlock(run.config),ui('small','detail.summary'),summaryTable(run.summary),ui('small','detail.source'),jsonBlock({run_id:run.id,state:run.state,retention:run.retention,sync:run.pending_mode?'background':'off',dropped:run.dropped,last_error:run.last_error}),jsonBlock(sessions));
    }else if(view==='files'){
      const response=await api('/runs/'+rid+'/artifacts',{signal:controller.signal});if(gen!==generation)return;
      for(const file of response.artifacts){
        const paragraph=el('p'),link=el('a',file.name);link.href='/api/v1/artifacts/'+encodeURIComponent(file.id)+'/content';link.target='_blank';link.rel='noopener';
        paragraph.append(link,bind(el('span'),()=> ' · '+readable(file.size)+' · '+file.kind));section.append(paragraph);
      }
      if(!response.artifacts.length)section.append(ui('p','empty.files',{},'muted'));
    }else{
      const kind=view==='logs'?'logs':'records';let cursor=null,count=0;
      const more=ui('button','action.loadMore',{},'pagination');
      const load=async()=>{
        more.disabled=true;
        try{
          const query=cursor?'?cursor='+encodeURIComponent(cursor):'';
          const response=await api('/runs/'+rid+'/'+kind+query,{signal:controller.signal});if(gen!==generation)return;
          for(const item of response[kind]){
            if(kind==='logs')section.insertBefore(el('pre',item.time+'  '+item.level.toUpperCase()+'  '+item.message),more);
            else renderRecord(section,item,more);
          }
          count+=response[kind].length;cursor=response.next_cursor;more.hidden=!cursor;
          if(!count)section.insertBefore(ui('p','empty.'+kind,{},'muted'),more);
        }finally{more.disabled=false}
      };
      more.onclick=()=>load().catch(e=>{if(e.name!=='AbortError')error(e)});section.append(more);await load();
    }
  }
}
function renderRecord(parent,item,before=null){
  const native=el('div',undefined,'native');parent.insertBefore(native,before);
  const heading=el('h3',item.name+' · ');
  heading.append(local.messages.en['kind.'+item.kind]?ui('span','kind.'+item.kind):el('span',item.kind));
  if(item.step!==null&&item.step!==undefined)heading.append(document.createTextNode(' · '),ui('span','record.step',{step:item.step}));
  native.append(heading);const payload=item.payload;
  if(item.kind==='text')native.append(el('p',payload.text));
  else if(item.kind==='table'){
    const table=el('table'),head=el('tr');
    for(const column of payload.columns||[])head.append(el('th',typeof column==='string'?column:column.name));table.append(head);
    for(const row of payload.rows||[]){const tr=el('tr');for(const value of row)tr.append(el('td',typeof value==='object'?JSON.stringify(value):String(value??'')));table.append(tr)}
    native.append(table);
  }else if(item.kind==='confusion_matrix'){
    const table=el('table'),head=el('tr');head.append(ui('th','record.confusionHeader'));
    for(const label of payload.labels||[])head.append(el('th',label.label||String(label)));table.append(head);
    const maximum=Math.max(1,...payload.counts.flat());
    (payload.counts||[]).forEach((row,index)=>{
      const tr=el('tr');tr.append(el('th',payload.labels?.[index]?.label||String(index)));
      for(const value of row){const cell=el('td',String(value));cell.style.background='rgba(var(--heatmap-rgb),'+(value/maximum*.25)+')';tr.append(cell)}table.append(tr);
    });native.append(table);
  }else if(item.kind==='histogram'){
    const svg=svgEl('svg',{viewBox:'0 0 600 180',class:'plot',role:'img'});bind(svg,'kind.histogram',{},'aria-label');
    const counts=payload.counts||[],maximum=Math.max(1,...counts);
    counts.forEach((value,index)=>{
      const bar=svgEl('rect',{x:40+index*540/counts.length,y:155-value/maximum*135,width:Math.max(1,540/counts.length-2),height:value/maximum*135,fill:'var(--histogram)'}),title=svgEl('title');
      title.textContent=`[${payload.edges[index]}, ${payload.edges[index+1]}]: ${value}`;bar.append(title);svg.append(bar);
    });native.append(svg);
  }else if(item.kind==='curve'){
    for(const [labelKey,x,y] of [['record.roc',payload.fpr||[],payload.tpr||[]],['record.pr',payload.recall||[],payload.precision||[]]]){
      native.append(ui('h3',labelKey));
      plot(native,[{meta:{run_id:item.name,labelKey,metric:item.name},columns:{x,value:y,value_state:y.map((value,index)=>value===null||x[index]===null?'missing':'finite')}}],'curve',0);
    }
  }else if(item.kind==='media'&&payload.artifact_id){
    const link=ui('a','action.openMedia');link.href='/api/v1/artifacts/'+encodeURIComponent(payload.artifact_id)+'/content';link.target='_blank';link.rel='noopener';native.append(link);
  }
  const raw=el('details');raw.append(ui('summary','action.inspectPayload'),jsonBlock(payload));native.append(raw);
}
function queryEditor(){
  const content=$('#content'),gen=generation;content.append(ui('p','query.description',{},'muted'));
  const editor=el('textarea');editor.value=JSON.stringify(querySpec([series[0]||{name:'train/loss',context:{}}]),null,2);bind(editor,'query.json',{},'aria-label');
  const run=ui('button','action.runQuery'),output=el('div');run.style.margin='12px 0';
  run.onclick=async()=>{
    run.disabled=true;
    try{
      clearError();const result=await api('/projects/'+project+'/query',{method:'POST',body:JSON.stringify(JSON.parse(editor.value)),signal:controller.signal});if(gen!==generation)return;output.replaceChildren(jsonBlock(result));
      if(result.page.next_cursor){
        const next=ui('button','action.nextPage');next.onclick=()=>{try{const value=JSON.parse(editor.value);value.page={...value.page,cursor:result.page.next_cursor};editor.value=JSON.stringify(value,null,2);run.click()}catch(e){error(e)}};output.append(next);
      }
    }catch(e){
      if(e.name!=='AbortError'&&gen===generation){error(e);output.replaceChildren(jsonBlock(e.protocol||{error:{code:e.code||e.name,message:e.message}}))}
    }finally{run.disabled=false;pruneBindings()}
  };
  content.append(editor,run,output);
}
async function storage(){
  const status=await api('/local/status',{signal:controller.signal}),content=$('#content'),stats=el('div',undefined,'stats');
  for(const [key,value,bytes] of [['events',status.history_events],['pending',status.pending_events],['acked',status.acked_events],['historyBytes',status.history_bytes,true],['mediaBytes',status.media_bytes,true]]){
    const card=el('div',undefined,'stat');card.append(ui('small','storage.'+key),bind(el('b'),()=>bytes?readable(value):formatNumber(value)));stats.append(card);
  }
  content.append(stats,ui('p','storage.retention',{},'muted'),jsonBlock(status.runs),ui('p','storage.resume'),el('pre','mlboard sync <logdir> --server http://127.0.0.1:8080'));
}
function repaintPlots(resizeOnly=false){
  prunePlots();
  for(const [node,state] of plotViews){
    if(resizeOnly&&state.width===node.clientWidth)continue;
    paintPlot(node,state.frames,state.axis,state.smoothing);state.width=node.clientWidth;
  }
  pruneBindings();
}
for(const [id,key,attribute] of [['experimentsHeading','experiments.heading'],['project','experiments.project','aria-label'],['search','experiments.search','placeholder'],['search','experiments.search','aria-label'],['moreRuns','action.loadMore'],['languageLabel','settings.language'],['themeLabel','settings.theme']])bind($('#'+id),key,{},attribute);
for(const option of $('#theme').options)bind(option,'theme.'+option.value);
function applyPreferences(state){
  document.documentElement.lang=state.language;document.documentElement.dataset.theme=state.resolvedTheme;document.title=t('page.title');
  $('#language').value=state.language;$('#theme').value=state.theme;updateBindings();selectedLabel();chartStatus();
  if(activeError)$('#error').textContent=local.errorText(language(),activeError);
  repaintPlots();
}
preferences.subscribe(applyPreferences);applyPreferences(preferences.snapshot());
$('#language').onchange=()=>preferences.setLanguage($('#language').value);
$('#theme').onchange=()=>preferences.setTheme($('#theme').value);
$('#experimentsToggle').onclick=()=>{const button=$('#experimentsToggle'),expanded=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(expanded));$('#experiments').classList.toggle('expanded',expanded)};
$('#project').onchange=async()=>{project=$('#project').value;cache.clear();await loadRuns();render()};let searchTimer;$('#search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{await loadRuns();render()}catch(e){error(e)}},220)};$('#moreRuns').onclick=()=>loadRuns(true).catch(error);
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>repaintPlots(true),80);
});
setInterval(()=>{if(document.hidden||chartQueue.active||chartQueue.pending)return;if(view==='workspace')drawVisible(generation,true)},5000);boot();
