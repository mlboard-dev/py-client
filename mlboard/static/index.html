<script>
'use strict';
const $=s=>document.querySelector(s), el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const palette=['#13786b','#bc7245','#4b70b5','#aa536e','#7d8038','#7b5da1','#388f99','#cb9461','#5c7483','#9c643f'];
let project='',runs=[],selected=new Set(),view='workspace',series=[],groups=new Map(),axes=localStorage.getItem('mlboard-axis')||'step',smooth=Number(localStorage.getItem('mlboard-smooth')||0),controller=null,generation=0,nextRun=null;
const names=new Map(), cache=new Map(), plotViews=new Map();
function error(e){$('#error').textContent=e.message||String(e);$('#error').style.display='block'}
function clearError(){$('#error').style.display='none'}
async function api(path,options={}){const res=await fetch('/api/v1'+path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await res.json();if(!res.ok)throw Object.assign(Error(body.error?.message||'Request failed'),{status:res.status,code:body.error?.code});return body}
function readable(n){return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KiB':(n/1048576).toFixed(1)+' MiB'}
function runName(id){return names.get(id)||id.slice(0,8)}
function stableColor(id){let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return palette[h%palette.length]}
function cancel(){generation++;chartQueue.cancel();plotViews.clear();if(controller)controller.abort();controller=new AbortController()}
async function boot(){try{const hash=new URLSearchParams(location.hash.slice(1));const token=hash.get('token');if(token){history.replaceState(null,'',location.pathname);const r=await fetch('/api/local/session',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Local session could not be opened')}const p=await api('/projects');for(const item of p.projects){const opt=el('option',item.name);opt.value=item.id;$('#project').append(opt)}if(!p.projects.length){$('#content').append(el('div','No experiments recorded yet.','empty'));return}project=p.projects[0].id;await loadRuns();await render()}catch(e){error(e)}}
async function loadRuns(append=false){const q=new URLSearchParams({search:$('#search').value,limit:'100'});if(append&&nextRun)q.set('cursor',nextRun);const data=await api('/projects/'+project+'/runs?'+q);runs=append?[...runs,...data.runs]:data.runs;nextRun=data.next_cursor;for(const r of runs)names.set(r.id,r.run_path);if(!append){selected=new Set(runs.slice(0,Math.min(3,runs.length)).map(r=>r.id))}drawRuns()}
function drawRuns(){const box=$('#runs');box.replaceChildren();let last='';for(const run of runs){const prefix=run.run_path.includes('/')?run.run_path.slice(0,run.run_path.lastIndexOf('/')):'Ungrouped';if(prefix!==last){box.append(el('small',prefix));last=prefix}const label=el('label',undefined,'run'),check=el('input');check.type='checkbox';check.checked=selected.has(run.id);check.onchange=()=>{if(check.checked&&selected.size>=10){check.checked=false;error(Error('Select at most 10 runs'));return}check.checked?selected.add(run.id):selected.delete(run.id);render()};const body=el('span',run.name||run.run_path);body.append(el('small',run.run_path),el('small',run.state,'state'));label.append(check,body);box.append(label)}$('#moreRuns').hidden=!nextRun}
function drawNav(){const nav=$('#nav');nav.replaceChildren();for(const [id,label] of [['workspace','Workspace'],['config','Config & summary'],['records','Structured data'],['files','Files'],['logs','Logs'],['query','Query inspector'],['storage','Storage & sync']]){const b=el('button',label,id===view?'active':'');b.onclick=()=>{view=id;render()};nav.append(b)}}
async function render(){cancel();clearError();drawNav();$('#experimentsToggle').textContent='Experiments · '+selected.size+' selected';const gen=generation,content=$('#content');content.replaceChildren();content.append(el('h2',{workspace:'Experiment workspace',config:'Run configuration',records:'Structured data',files:'Recorded files',logs:'Training logs',query:'Query inspector',storage:'Storage & sync'}[view]));if(!selected.size&&view!=='storage'){content.append(el('div','Select an experiment in the list.','empty'));return}try{if(view==='workspace')await workspace(gen);else if(view==='query')queryEditor();else if(view==='storage')await storage();else await detail(gen)}catch(e){if(e.name!=='AbortError')error(e)}}
function querySpec(metrics){return {schema_version:'mlboard.query/v1',runs:{run_ids:[...selected]},source:{kind:'scalar',metrics:metrics.map(m=>({name:m.name,context:m.context||{}}))},x:{field:axes},read:{producers:{mode:'primary'},sessions:{mode:'all'},duplicate_steps:'latest_logical'},transform:{kind:'downsample',algorithm:'min_max',points_per_series:600},page:{limit:20000},budget:{max_runs:10,max_series:20,max_points:20000,max_scanned_points:250000,max_bytes:2097152}}}
async function workspace(gen){const c=$('#content');const tools=el('div',undefined,'tools'),axis=el('select');for(const [v,l] of [['step','Step'],['epoch','Epoch'],['elapsed_seconds','Elapsed seconds'],['session_elapsed_seconds','Session seconds'],['wall_time','Wall time'],['processed_samples','Processed samples']]){const o=el('option',l);o.value=v;o.selected=axes===v;axis.append(o)}axis.onchange=()=>{axes=axis.value;localStorage.setItem('mlboard-axis',axes);drawVisible(gen)};const axisLabel=el('label','X axis');axisLabel.append(axis);const smoothing=el('input');smoothing.type='range';smoothing.min=0;smoothing.max=.95;smoothing.step=.05;smoothing.value=smooth;const smoothLabel=el('label','Smoothing');smoothLabel.append(smoothing);smoothing.oninput=()=>{smooth=Number(smoothing.value);localStorage.setItem('mlboard-smooth',smooth);drawVisible(gen)};const refresh=el('button','Refresh');refresh.onclick=()=>drawVisible(gen,true);tools.append(axisLabel,smoothLabel,refresh);c.append(tools);const unique=new Map();for(const rid of selected){let cursor=null,total=0;do{const q=cursor?'?limit=1000&cursor='+encodeURIComponent(cursor):'?limit=1000';const res=await api('/runs/'+rid+'/series'+q,{signal:controller.signal});for(const m of res.series)if(m.kind==='scalar')unique.set(m.name+'|'+JSON.stringify(m.context),m);cursor=res.next_cursor;total+=res.series.length;if(total>=1000&&cursor)throw Error('Metric directory exceeds 1,000 entries; use the query inspector with explicit names')}while(cursor)}if(gen!==generation)return;series=[...unique.values()].sort((a,b)=>a.name.localeCompare(b.name));groups=new Map();for(const m of series){const key=m.name.includes('/')?m.name.slice(0,m.name.lastIndexOf('/')):'Metrics';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(m)}let i=0;for(const [key,metrics] of groups){const group=el('details',undefined,'group');group.dataset.group=key;const saved=localStorage.getItem('mlboard-group-'+key);group.open=saved===null?i++===0:saved==='true';const title=el('summary',key);title.append(el('small',metrics.length+' metrics'));group.append(title,el('div',undefined,'cards'));let previousOpen=group.open;group.ontoggle=()=>{if(group.open===previousOpen)return;previousOpen=group.open;localStorage.setItem('mlboard-group-'+key,String(group.open));if(!group.open)group.querySelector('.cards').replaceChildren();drawVisible(gen)};c.append(group)}if(!series.length)c.append(el('div','No scalar observations have been recorded yet.','empty'));await drawVisible(gen)}
class LatestQueryQueue {
  constructor(execute,onError=()=>{}){
    this.execute=execute;this.onError=onError;
    this.active=null;this.pending=null;this.latestKey=null;this.timer=null;
  }
  cancel(){
    this.latestKey=null;
    if(this.pending)this.pending.resolve(false);
    this.pending=null;
    clearTimeout(this.timer);this.timer=null;
    // Let an HTTP request settle: aborting fetch cannot cancel server work.
  }
  submit(job){
    this.latestKey=job.key;
    if(this.active?.key===job.key){
      if(this.pending)this.pending.resolve(false);
      this.pending=null;return this.active.promise;
    }
    if(this.pending?.key===job.key){
      this.pending.force=this.pending.force||job.force;return this.pending.promise;
    }
    if(this.pending)this.pending.resolve(false);
    job.promise=new Promise(resolve=>job.resolve=resolve);
    this.pending=job;this.schedule();return job.promise;
  }
  schedule(){
    if(!this.active&&!this.timer&&this.pending)this.timer=setTimeout(()=>this.pump(),25);
  }
  async pump(){
    this.timer=null;
    if(this.active||!this.pending)return;
    const job=this.pending;this.pending=null;this.active=job;
    const current=()=>this.latestKey===job.key;
    try{await this.execute(job,current)}
    catch(e){if(current())this.onError(e,job)}
    finally{this.active=null;job.resolve(current());this.schedule()}
  }
}
async function loadChartResponse(job,current){
  const deadline=Date.now()+5000;
  for(let attempt=0;attempt<8;attempt++){
    if(!current())throw new DOMException('Query superseded','AbortError');
    const remaining=deadline-Date.now();
    if(remaining<=0)throw Error('Query timed out. Refresh to retry.');
    const requestController=new AbortController();
    const timeout=setTimeout(()=>requestController.abort(),remaining);
    try{
      return await api('/projects/'+job.project+'/query',{method:'POST',body:JSON.stringify(job.spec),signal:requestController.signal});
    }catch(e){
      if(e.name==='AbortError')throw Error('Query timed out. Refresh to retry.');
      if(e.status!==429||e.code!=='QUERY_BUSY'||attempt===7)throw e;
    }finally{clearTimeout(timeout)}
    await new Promise(resolve=>setTimeout(resolve,Math.min(800,150*2**attempt,Math.max(0,deadline-Date.now()))));
  }
}
function metricKey(metric){return JSON.stringify([metric.name,metric.context||{}])}
function chartCard(metric){return [...document.querySelectorAll('.card[data-metric]')].find(n=>n.dataset.metric===metricKey(metric))}
function prepareChartCards(open,chosen){
  for(const group of open){
    const cards=group.querySelector('.cards');
    for(const metric of groups.get(group.dataset.group)||[]){
      let card=[...cards.children].find(n=>n.dataset.metric===metricKey(metric));
      if(!card){card=el('div',undefined,'card');card.dataset.metric=metricKey(metric);cards.append(card)}
      if(!chosen.includes(metric))card.replaceChildren(el('h3',metric.name),el('p','Query limit reached. Collapse another metric group or use Query inspector.','muted'));
      else if(!card.querySelector('.plot'))card.replaceChildren(el('h3',metric.name),el('p','Loading observations…','muted'));
    }
  }
}
const chartQueue=new LatestQueryQueue(async(job,current)=>{
  let response;
  if(!job.force&&cache.has(job.cacheKey))response=cache.get(job.cacheKey);
  else{
    response=await loadChartResponse(job,current);
    cache.set(job.cacheKey,response);
    while(cache.size>8)cache.delete(cache.keys().next().value);
  }
  if(!current()||job.generation!==generation||view!=='workspace')return;
  clearError();
  for(const metric of job.chosen){
    const frames=response.frames.filter(f=>f.meta.metric===metric.name&&JSON.stringify(f.meta.context||{})===JSON.stringify(metric.context||{}));
    const card=chartCard(metric);if(!card)continue;
    card.replaceChildren(el('h3',metric.name));plot(card,frames,job.axis);
  }
  prunePlots();
  $('#notice').textContent=response.page.returned_rows+' points · '+new Date().toLocaleTimeString();
},(e,job)=>{
  if(e.name==='AbortError'||job.generation!==generation||view!=='workspace')return;
  error(e);
  for(const metric of job.chosen){
    const card=chartCard(metric);
    if(card&&!card.querySelector('.plot'))card.replaceChildren(el('h3',metric.name),el('p',e.message,'muted'));
  }
});
function drawVisible(gen,force=false){
  if(gen!==generation||view!=='workspace')return Promise.resolve(false);
  const open=[...document.querySelectorAll('details.group[open]')];
  const metrics=open.flatMap(g=>groups.get(g.dataset.group)||[]);
  if(!metrics.length){chartQueue.cancel();return Promise.resolve(false)}
  const maximum=Math.max(1,Math.floor(20/selected.size)),chosen=metrics.slice(0,maximum);
  prepareChartCards(open,chosen);prunePlots();
  const spec=querySpec(chosen),cacheKey=JSON.stringify(spec);
  return chartQueue.submit({key:gen+':'+project+':'+cacheKey,cacheKey,spec,project,generation:gen,chosen,axis:axes,force});
}
function svgEl(tag,attrs={}){const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,String(v));return n}
function prunePlots(){for(const node of plotViews.keys())if(!node.isConnected)plotViews.delete(node)}
function plot(parent,frames,axis,smoothing=smooth){
  const target=el('div');parent.append(target);
  paintPlot(target,frames,axis,smoothing);
  plotViews.set(target,{frames,axis,smoothing,width:target.clientWidth});
}
function paintPlot(parent,frames,axis,smoothing){
  parent.replaceChildren();
  const style=getComputedStyle(parent);
  const width=parent.clientWidth-parseFloat(style.paddingLeft||0)-parseFloat(style.paddingRight||0);
  const W=Math.max(240,Math.floor(width||610)),H=260,L=58,R=14,T=14,B=36;
  const integerAxis=['step','processed_samples'].includes(axis)&&frames.every(f=>f.columns.x.every(x=>typeof x==='string'&&/^[0-9]+$/.test(x)));
  let origin=null;
  if(integerAxis)for(const f of frames)for(const x of f.columns.x){const exact=BigInt(x);if(origin===null||exact<origin)origin=exact}
  const position=x=>axis==='wall_time'?Date.parse(x):integerAxis?Number(BigInt(x)-origin):Number(x);
  const labelX=x=>axis==='wall_time'?new Date(x).toLocaleTimeString():integerAxis?String(origin+BigInt(Math.round(x))):Number(x.toPrecision(4)).toString();
  let all=[];
  const prepared=frames.map(f=>{
    let avg=null;
    const points=f.columns.x.map((x,i)=>{
      let y=f.columns.value[i];
      if(f.columns.value_state[i]!=='finite'||y===null){avg=null;y=null}
      else{avg=avg===null?y:smoothing*avg+(1-smoothing)*y;y=avg}
      return [position(x),y,i];
    });
    all.push(...points.filter(p=>p[1]!==null));return {f,points};
  });
  if(!all.length){parent.append(el('div','No finite observations on this axis. Missing values are not zero.','empty'));return}
  const xs=all.map(p=>p[0]),ys=all.map(p=>p[1]);
  let xmin=Math.min(...xs),xmax=Math.max(...xs),ymin=Math.min(...ys),ymax=Math.max(...ys);
  if(xmin===xmax)xmax=xmin+1;
  if(ymin===ymax){ymin-=.5;ymax+=.5}
  const pad=(ymax-ymin)*.07;ymin-=pad;ymax+=pad;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(ymax-y)/(ymax-ymin)*(H-T-B);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`,class:'plot',role:'img','aria-label':'Recorded metric curves'});
  for(let i=0;i<=4;i++){
    const y=T+i*(H-T-B)/4;
    svg.append(svgEl('line',{x1:L,x2:W-R,y1:y,y2:y,stroke:'#e5ece6'}));
    const label=svgEl('text',{x:L-8,y:y+4,'text-anchor':'end',fill:'#75827a','font-size':11});
    label.textContent=(ymax-i*(ymax-ymin)/4).toPrecision(3);svg.append(label);
  }
  for(let i=0;i<=4;i++){
    const value=xmin+i*(xmax-xmin)/4,label=svgEl('text',{x:X(value),y:H-12,'text-anchor':'middle',fill:'#75827a','font-size':11});
    label.textContent=labelX(value);svg.append(label);
  }
  for(const {f,points} of prepared){
    let path='',move=true;
    for(const [x,y] of points){if(y===null){move=true;continue}path+=(move?'M':'L')+X(x).toFixed(2)+','+Y(y).toFixed(2);move=false}
    const color=stableColor(f.meta.run_id),line=svgEl('path',{d:path,fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round'});
    svg.append(line);
    if(points.filter(p=>p[1]!==null).length===1){const p=points.find(p=>p[1]!==null);svg.append(svgEl('circle',{cx:X(p[0]),cy:Y(p[1]),r:3,fill:color}))}
    const title=svgEl('title');title.textContent=(f.meta.label||runName(f.meta.run_id))+' · '+f.meta.metric;line.append(title);
  }
  parent.append(svg);
  const legend=el('div',undefined,'legend');
  for(const {f} of prepared){const item=el('span'),dot=el('i',undefined,'swatch');dot.style.background=stableColor(f.meta.run_id);item.append(dot,document.createTextNode(f.meta.label||runName(f.meta.run_id)));legend.append(item)}
  parent.append(legend);
}
function summaryTable(summary){
  const wrapper=el('div',undefined,'native'),table=el('table'),head=el('tr');
  for(const name of ['Metric','Context','Last','Min','Max','Count'])head.append(el('th',name));
  table.append(head);
  const values=Object.values(summary).sort((a,b)=>a.name.localeCompare(b.name)||JSON.stringify(a.context).localeCompare(JSON.stringify(b.context)));
  for(const metric of values){
    const row=el('tr');
    for(const value of [metric.name,JSON.stringify(metric.context),metric.value_state==='finite'?metric.last:metric.value_state,metric.min,metric.max,metric.count])row.append(el('td',String(value??'—')));
    table.append(row);
  }
  wrapper.append(table);return wrapper;
}
function jsonBlock(value){return el('pre',JSON.stringify(value,null,2))}
async function detail(gen){const c=$('#content');for(const rid of selected){const section=el('section',undefined,'card');section.style.marginTop='16px';section.append(el('h3',runName(rid)));c.append(section);if(view==='config'){const r=await api('/runs/'+rid,{signal:controller.signal});if(gen!==generation)return;section.append(el('small','CONFIG'),jsonBlock(r.config),el('small','SUMMARY · PRIMARY LOGICAL STREAM'),summaryTable(r.summary),el('small','SOURCE & SESSIONS'),jsonBlock({run_id:r.id,state:r.state,retention:r.retention,sync:r.pending_mode?'background':'off',dropped:r.dropped,last_error:r.last_error}),jsonBlock(await api('/runs/'+rid+'/sessions')))}else if(view==='files'){const res=await api('/runs/'+rid+'/artifacts',{signal:controller.signal});if(gen!==generation)return;for(const file of res.artifacts){const p=el('p'),a=el('a',file.name);a.href='/api/v1/artifacts/'+encodeURIComponent(file.id)+'/content';a.target='_blank';a.rel='noopener';p.append(a,document.createTextNode(' · '+readable(file.size)+' · '+file.kind));section.append(p)}if(!res.artifacts.length)section.append(el('p','No files recorded.','muted'))}else{const kind=view==='logs'?'logs':'records';let cursor=null;const load=async()=>{const q=cursor?'?cursor='+encodeURIComponent(cursor):'';const res=await api('/runs/'+rid+'/'+kind+q,{signal:controller.signal});if(gen!==generation)return;for(const item of res[kind]){if(kind==='logs'){const line=el('pre',item.time+'  '+item.level.toUpperCase()+'  '+item.message);section.append(line)}else renderRecord(section,item)}cursor=res.next_cursor;more.hidden=!cursor};const more=el('button','Load more','pagination');more.onclick=()=>load().catch(error);await load();section.append(more)}}}
function renderRecord(parent,item){const native=el('div',undefined,'native');parent.append(native);native.append(el('h3',item.name+' · '+item.kind+(item.step===null?'':' · step '+item.step)));const p=item.payload;if(item.kind==='text')native.append(el('p',p.text));else if(item.kind==='table'){const table=el('table'),head=el('tr');for(const c of p.columns||[])head.append(el('th',typeof c==='string'?c:c.name));table.append(head);for(const row of p.rows||[]){const tr=el('tr');for(const v of row)tr.append(el('td',typeof v==='object'?JSON.stringify(v):String(v??'')));table.append(tr)}native.append(table)}else if(item.kind==='confusion_matrix'){const table=el('table'),head=el('tr','');head.append(el('th','Actual / predicted'));for(const l of p.labels||[])head.append(el('th',l.label||String(l)));table.append(head);(p.counts||[]).forEach((row,i)=>{const tr=el('tr');tr.append(el('th',p.labels?.[i]?.label||String(i)));for(const v of row){const cell=el('td',String(v));cell.style.background='rgba(20,102,90,'+(v/Math.max(1,...p.counts.flat())*.25)+')';tr.append(cell)}table.append(tr)});native.append(table)}else if(item.kind==='histogram'){const svg=svgEl('svg',{viewBox:'0 0 600 180',class:'plot'}),counts=p.counts||[],max=Math.max(1,...counts);counts.forEach((v,i)=>{const bar=svgEl('rect',{x:40+i*540/counts.length,y:155-v/max*135,width:Math.max(1,540/counts.length-2),height:v/max*135,fill:'#4c9182'}),t=svgEl('title');t.textContent=`[${p.edges[i]}, ${p.edges[i+1]}]: ${v}`;bar.append(t);svg.append(bar)});native.append(svg)}else if(item.kind==='curve'){for(const [label,x,y] of [['ROC · false positive rate → true positive rate',p.fpr||[],p.tpr||[]],['Precision–recall · recall → precision',p.recall||[],p.precision||[]]]){native.append(el('h3',label));plot(native,[{meta:{run_id:item.name,label,metric:item.name},columns:{x,value:y,value_state:y.map((v,i)=>v===null||x[i]===null?'missing':'finite')}}],'curve',0)}}else if(item.kind==='media'&&p.artifact_id){const link=el('a','Open media');link.href='/api/v1/artifacts/'+encodeURIComponent(p.artifact_id)+'/content';link.target='_blank';link.rel='noopener';native.append(link)}const raw=el('details'),summary=el('summary','Inspect payload');raw.append(summary,jsonBlock(p));native.append(raw)}
function queryEditor(){const c=$('#content');c.append(el('p','The same bounded public read API drives the curves. Source data remains read-only.','muted'));const editor=el('textarea');editor.value=JSON.stringify(querySpec([{name:series[0]?.name||'train/loss',context:{}}]),null,2);editor.setAttribute('aria-label','Query JSON');const run=el('button','Run query'),output=el('div');run.style.margin='12px 0';run.onclick=async()=>{try{clearError();const result=await api('/projects/'+project+'/query',{method:'POST',body:JSON.stringify(JSON.parse(editor.value)),signal:controller.signal});output.replaceChildren(jsonBlock(result));if(result.page.next_cursor){const next=el('button','Next page');next.onclick=()=>{const value=JSON.parse(editor.value);value.page={...value.page,cursor:result.page.next_cursor};editor.value=JSON.stringify(value,null,2);run.click()};output.append(next)}}catch(e){error(e)}};c.append(editor,run,output)}
async function storage(){const s=await api('/local/status',{signal:controller.signal}),c=$('#content'),stats=el('div',undefined,'stats');for(const [label,value] of [['Retained events',s.history_events],['Pending uploads',s.pending_events],['Acknowledged',s.acked_events],['History bytes',readable(s.history_bytes)],['Media bytes',readable(s.media_bytes)]]){const card=el('div',undefined,'stat');card.append(el('small',label),el('b',String(value)));stats.append(card)}c.append(stats,el('p','record retains history after ACK. cache may have incomplete local coverage. sync=off creates no pending upload references.','muted'),jsonBlock(s.runs),el('p','Resume uploads from the terminal:'),el('pre','mlboard sync <logdir> --server http://127.0.0.1:8080'))}
$('#experimentsToggle').onclick=()=>{const button=$('#experimentsToggle'),expanded=button.getAttribute('aria-expanded')!=='true';button.setAttribute('aria-expanded',String(expanded));$('#experiments').classList.toggle('expanded',expanded)};
$('#project').onchange=async()=>{project=$('#project').value;cache.clear();await loadRuns();render()};let searchTimer;$('#search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(async()=>{try{await loadRuns();render()}catch(e){error(e)}},220)};$('#moreRuns').onclick=()=>loadRuns(true).catch(error);
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    prunePlots();
    for(const [node,state] of plotViews){
      if(state.width===node.clientWidth)continue;
      paintPlot(node,state.frames,state.axis,state.smoothing);state.width=node.clientWidth;
    }
  },80);
});
setInterval(()=>{if(document.hidden||chartQueue.active||chartQueue.pending)return;if(view==='workspace')drawVisible(generation,true)},5000);boot();
