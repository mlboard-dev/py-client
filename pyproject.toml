[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlboard"
version = "0.1.0"
description = "Training-first local experiment recorder and MLBoard client"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "MLBoard contributors"}]
dependencies = []

[project.optional-dependencies]
serve = []
tensorboard = ["tensorboard==2.20.0"]

[project.scripts]
mlboard = "mlboard.cli:main"

[tool.setuptools.package-data]
mlboard = ["static/*.html"]
